# MG Studio · Nginx du conteneur du site (port 80, publié sur 127.0.0.1 du VPS uniquement).
# HTTPS, HSTS et noms de domaine : gérés par le Nginx Proxy Manager de la stack d'infra.

# Pages à ne pas indexer : /carte (QR de la carte de visite), sa fiche contact et la 404
map $uri $mg_robots {
    ~^/carte         "noindex";
    ~\.vcf$          "noindex";
    /404.html        "noindex";
    default          "";
}

# Cache : fichiers d'Astro nommés par empreinte (immuables), polices un mois, le reste revalidé à chaque visite
map $uri $mg_cache {
    ~^/_astro/       "public, max-age=31536000, immutable";
    ~^/fonts/        "public, max-age=2592000";
    default          "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Pas de journal d'accès ici : NPM tient déjà celui des visites (effacé en cinq semaines) ; les erreurs restent
    access_log off;

    # Redirections relatives : derrière le proxy, /carte renvoie vers /carte/ sur le bon domaine et en HTTPS
    absolute_redirect off;

    # Vraie adresse du visiteur : NPM l'envoie dans X-Real-IP. Le conteneur (Docker rootless) ne voit que la
    # passerelle de son réseau (172.x) ; il n'est publié que sur 127.0.0.1 du VPS, donc seul NPM peut le joindre
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # En-têtes posés une seule fois ici : un add_header dans un bloc location effacerait tous ceux-ci
    add_header X-Robots-Tag $mg_robots always;
    add_header Cache-Control $mg_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml text/plain application/json;

    # Page introuvable, servie avec le statut 404
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fiche contact de la page /carte : reconnue comme un contact par les téléphones
    location ~ \.vcf$ {
        types { }
        default_type "text/vcard; charset=utf-8";
        try_files $uri =404;
    }

    # Fichiers cachés (aucun n'est publié, par précaution)
    location ~ /\. {
        return 404;
    }
}
