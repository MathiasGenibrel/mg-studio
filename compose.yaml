# MG Studio · conteneur du site, lancé par le Docker rootless de l'utilisateur « deploy » sur le VPS.
# Ce fichier y est copié à la main (~deploy/apps/mg-studio/compose.yaml, appartenant à root) : la CI ne peut pas
# le modifier, elle charge seulement l'image et relance (deploy/server/mg-deploy-site).
# Le site n'est publié que sur 127.0.0.1:8080 ; Nginx Proxy Manager (hors de ce dépôt) le sert en HTTPS.
name: mg-studio
services:
  site:
    image: mg-studio-site:${MG_TAG:?MG_TAG manquant (version à lancer)}
    container_name: mg-studio-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Nginx n'a besoin que de changer d'utilisateur pour ses workers et d'écouter le port 80 (testé sur le VPS)
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 200
